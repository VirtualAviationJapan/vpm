name: Generate VPM repository

on:
  pull_request:

permissions:
  contents: write

env:
  vpm_repo_author: VirtualAviationJapan
  vpm_repo_id: jp.virtualaviation
  vpm_repo_name: VirtualAviationJapan
  vpm_repo_url: https://virtualaviationjapan.github.io/vpm/vpm.json

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: >
          uv run main.py
          ${{ env.vpm_repo_author}}
          ${{ env.vpm_repo_id }}
          ${{ env.vpm_repo_name }}
          ${{ env.vpm_repo_url}}
          vpm.json
      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "chore: update vpm.json"
